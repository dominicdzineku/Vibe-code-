<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>rose gold habit tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f9ede9 0%, #f5e0d3 100%);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    .tracker-card {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 245, 240, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: #fff7f3;
      box-shadow: 0 25px 45px rgba(180, 130, 120, 0.25), 0 10px 20px rgba(160, 120, 110, 0.2);
      border-radius: 42px;
      padding: 2rem 1.8rem 2.2rem;
      border: 1px solid rgba(230, 180, 160, 0.5);
      transition: all 0.2s ease;
    }

    h1 {
      font-weight: 500;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: #b17b6b;
      text-align: center;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-shadow: 0 2px 4px rgba(200, 150, 130, 0.2);
    }
    h1 span {
      background: #eacfc7;
      color: #7b4b3a;
      font-size: 1.6rem;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
    }

    .habits-container {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-top: 0.8rem;
    }

    .habit-row {
      background: rgba(253, 242, 235, 0.9);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      background: #fef5ef;
      border-radius: 28px;
      padding: 1.2rem 1.2rem 1rem;
      box-shadow: 0 8px 18px rgba(190, 145, 125, 0.18);
      border: 1px solid #efd5c8;
      transition: transform 0.15s ease;
    }

    .habit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
    }

    .habit-name {
      font-weight: 550;
      font-size: 1.3rem;
      color: #885f4f;
      background: #ffeae0;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      box-shadow: inset 0 1px 4px rgba(255, 245, 240, 0.8);
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: #f9e1d4;
      border-radius: 30px;
      padding: 0.25rem 1rem 0.25rem 0.9rem;
    }

    .progress-bar-bg {
      width: 100px;
      height: 10px;
      background: #fadbcb;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 5px rgba(160, 110, 90, 0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d9a793, #c28b78);
      border-radius: 20px;
      transition: width 0.3s ease;
      box-shadow: 0 0 6px #e6b7a8;
    }

    .progress-text {
      font-weight: 600;
      font-size: 0.9rem;
      color: #7b4b3a;
      min-width: 42px;
      text-align: right;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.6rem;
      justify-items: center;
      align-items: center;
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .day-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #b0846e;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: #f7e0d2;
      padding: 0.15rem 0.4rem;
      border-radius: 12px;
    }

    .habit-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 32px;
      height: 32px;
      background: #fff5ef;
      border: 2px solid #dbb7a5;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(180, 130, 110, 0.15);
      position: relative;
      background: #fef8f4;
    }

    .habit-checkbox:checked {
      background: #e2bfb0;
      border-color: #b5826e;
      box-shadow: 0 0 12px #e7bfae;
      background: #dba892;
    }

    .habit-checkbox:checked::after {
      content: "✓";
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff8f3;
      display: block;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(120, 70, 50, 0.4);
    }

    .habit-checkbox:hover {
      border-color: #c2907a;
      background: #ffeae0;
      transform: scale(1.02);
    }

    .reset-area {
      display: flex;
      justify-content: center;
      margin-top: 2.2rem;
    }

    .reset-btn {
      background: #f3ddd2;
      border: 1px solid #dbb7a5;
      color: #7b5343;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.7rem 2.2rem;
      border-radius: 40px;
      background: #fae6dd;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.4px;
      box-shadow: 0 6px 14px rgba(190, 140, 120, 0.25);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px solid #e7c4b4;
    }

    .reset-btn:hover {
      background: #f1cfbf;
      border-color: #c28b76;
      color: #5e3a2e;
      box-shadow: 0 10px 18px rgba(180, 120, 100, 0.3);
    }

    @media (max-width: 480px) {
      .tracker-card {
        padding: 1.5rem 1rem;
      }
      .habit-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.7rem;
      }
      .progress-wrapper {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="tracker-card">
    <h1>
      ✦ rose habits <span>7 days</span>
    </h1>

    <div class="habits-container" id="habitsContainer">
      <!-- habit rows dynamically generated by JavaScript -->
    </div>

    <div class="reset-area">
      <button class="reset-btn" id="resetButton">
        <span>↺</span> reset week
      </button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- habits definition ----------
      const HABIT_NAMES = ["🌿 Hydrate", "📖 Read", "🧘 Stretch", "💤 Sleep early"];
      
      // days labels (Mon to Sun)
      const DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      
      // localStorage key
      const STORAGE_KEY = "rose_gold_habit_tracker";

      // ---------- state: 2D array [habitIndex][dayIndex] = boolean ----------
      let habitsData = [];

      // ---------- load from localStorage or initialize ----------
      function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            // validate structure: array of 4 habits, each with 7 booleans
            if (Array.isArray(parsed) && parsed.length === HABIT_NAMES.length) {
              const isValid = parsed.every(dayArray => 
                Array.isArray(dayArray) && dayArray.length === DAY_LABELS.length &&
                dayArray.every(item => typeof item === 'boolean')
              );
              if (isValid) {
                habitsData = parsed;
                return;
              }
            }
          } catch (e) {
            console.warn("Failed to parse localStorage, resetting data.");
          }
        }
        // default: all unchecked (false)
        habitsData = HABIT_NAMES.map(() => DAY_LABELS.map(() => false));
      }

      // ---------- save to localStorage ----------
      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(habitsData));
      }

      // ---------- update progress bar for a given habit index ----------
      function updateProgress(habitIndex) {
        const habitRow = document.getElementById(`habit-${habitIndex}`);
        if (!habitRow) return;
        
        const progressFill = habitRow.querySelector('.progress-fill');
        const progressText = habitRow.querySelector('.progress-text');
        
        const completedCount = habitsData[habitIndex].filter(Boolean).length;
        const totalDays = DAY_LABELS.length;
        const percent = totalDays === 0 ? 0 : Math.round((completedCount / totalDays) * 100);
        
        if (progressFill) {
          progressFill.style.width = `${percent}%`;
        }
        if (progressText) {
          progressText.textContent = `${completedCount}/${totalDays}`;
        }
      }

      // ---------- update all progress bars ----------
      function updateAllProgress() {
        for (let i = 0; i < HABIT_NAMES.length; i++) {
          updateProgress(i);
        }
      }

      // ---------- handle checkbox change ----------
      function handleCheckboxChange(habitIndex, dayIndex) {
        return function(event) {
          const checked = event.target.checked;
          // update state
          habitsData[habitIndex][dayIndex] = checked;
          // persist
          saveToStorage();
          // update progress for this habit
          updateProgress(habitIndex);
        };
      }

      // ---------- render entire grid based on habitsData ----------
      function renderAllHabits() {
        const container = document.getElementById('habitsContainer');
        if (!container) return;
        
        // clear container
        container.innerHTML = '';

        // create each habit row
        habitsData.forEach((daysArray, habitIdx) => {
          const habitName = HABIT_NAMES[habitIdx];
          
          // create row element
          const habitRow = document.createElement('div');
          habitRow.className = 'habit-row';
          habitRow.id = `habit-${habitIdx}`;
          
          // header: habit name + progress
          const headerDiv = document.createElement('div');
          headerDiv.className = 'habit-header';
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'habit-name';
          nameSpan.textContent = habitName;
          
          const progressWrapper = document.createElement('div');
          progressWrapper.className = 'progress-wrapper';
          
          const progressBg = document.createElement('div');
          progressBg.className = 'progress-bar-bg';
          const progressFill = document.createElement('div');
          progressFill.className = 'progress-fill';
          progressFill.style.width = '0%'; // will be set by updateProgress
          progressBg.appendChild(progressFill);
          
          const progressText = document.createElement('span');
          progressText.className = 'progress-text';
          progressText.textContent = '0/7';
          
          progressWrapper.appendChild(progressBg);
          progressWrapper.appendChild(progressText);
          
          headerDiv.appendChild(nameSpan);
          headerDiv.appendChild(progressWrapper);
          
          // days grid
          const daysGrid = document.createElement('div');
          daysGrid.className = 'days-grid';
          
          // create day cells
          daysArray.forEach((isChecked, dayIdx) => {
            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            
            const dayLabel = document.createElement('span');
            dayLabel.className = 'day-label';
            dayLabel.textContent = DAY_LABELS[dayIdx];
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'habit-checkbox';
            checkbox.checked = isChecked;
            // data attributes for debugging not strictly needed
            checkbox.setAttribute('aria-label', `${habitName} ${DAY_LABELS[dayIdx]}`);
            
            // add change listener
            checkbox.addEventListener('change', handleCheckboxChange(habitIdx, dayIdx));
            
            dayCell.appendChild(dayLabel);
            dayCell.appendChild(checkbox);
            daysGrid.appendChild(dayCell);
          });
          
          habitRow.appendChild(headerDiv);
          habitRow.appendChild(daysGrid);
          container.appendChild(habitRow);
        });
        
        // after rendering, set progress bars to correct values
        updateAllProgress();
      }

      // ---------- reset all habits to unchecked ----------
      function resetAllHabits() {
        // set all values to false
        for (let i = 0; i < habitsData.length; i++) {
          for (let j = 0; j < habitsData[i].length; j++) {
            habitsData[i][j] = false;
          }
        }
        saveToStorage();
        
        // update UI: checkboxes and progress bars
        // find all checkboxes and uncheck them, then update progress
        const allCheckboxes = document.querySelectorAll('.habit-checkbox');
        allCheckboxes.forEach(cb => {
          cb.checked = false;
        });
        updateAllProgress();
      }

      // ---------- setup event listeners and initial render ----------
      function init() {
        loadFromStorage();
        renderAllHabits();
        
        const resetBtn = document.getElementById('resetButton');
        if (resetBtn) {
          resetBtn.addEventListener('click', resetAllHabits);
        }
      }

      // start everything when DOM is ready
      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
