<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>red hot habit tracker · 7 days</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a0a0a 0%, #2d1010 50%, #1a0808 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated background grain */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.04"/></svg>');
      pointer-events: none;
      z-index: 0;
    }

    .tracker-card {
      max-width: 700px;
      width: 100%;
      background: rgba(20, 5, 5, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: #1f0a0a;
      box-shadow: 0 30px 50px rgba(180, 20, 20, 0.35), 0 0 30px rgba(220, 30, 30, 0.25), inset 0 1px 0 rgba(255, 80, 80, 0.2);
      border-radius: 48px;
      padding: 2.2rem 2rem 2.4rem;
      border: 1px solid rgba(255, 70, 70, 0.4);
      transition: all 0.25s ease;
      position: relative;
      z-index: 2;
      animation: cardGlow 3s infinite alternate;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 25px 45px rgba(200, 15, 15, 0.4), 0 0 30px rgba(255, 40, 40, 0.3), inset 0 1px 0 rgba(255, 70, 70, 0.25); }
      100% { box-shadow: 0 30px 55px rgba(210, 10, 10, 0.5), 0 0 45px rgba(255, 30, 30, 0.45), inset 0 1px 0 rgba(255, 90, 90, 0.35); }
    }

    h1 {
      font-weight: 600;
      font-size: 2.3rem;
      letter-spacing: -0.5px;
      color: #ff4d4d;
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      text-shadow: 0 0 15px #ff2a2a, 0 4px 8px rgba(150, 0, 0, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 span {
      background: #2a0a0a;
      color: #ff5e5e;
      font-size: 1.4rem;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      border: 1px solid #c04040;
      box-shadow: 0 0 12px #ff3a3a;
      letter-spacing: 0.5px;
    }

    .habits-container {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-top: 0.5rem;
    }

    .habit-row {
      background: rgba(30, 8, 8, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: #250b0b;
      border-radius: 32px;
      padding: 1.3rem 1.3rem 1.1rem;
      box-shadow: 0 12px 24px rgba(160, 0, 0, 0.35), inset 0 1px 2px rgba(255, 80, 80, 0.3);
      border: 1px solid #b33a3a;
      transition: transform 0.2s ease, box-shadow 0.2s;
      animation: rowPulse 2.5s infinite alternate;
    }

    @keyframes rowPulse {
      0% { border-color: #b33a3a; box-shadow: 0 12px 24px rgba(180, 0, 0, 0.4); }
      100% { border-color: #d94f4f; box-shadow: 0 14px 28px rgba(200, 0, 0, 0.55); }
    }

    .habit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      gap: 0.8rem;
    }

    .habit-name {
      font-weight: 600;
      font-size: 1.35rem;
      color: #ff9f9f;
      background: #350f0f;
      padding: 0.3rem 1.4rem;
      border-radius: 40px;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 0 14px #c03939, inset 0 1px 3px rgba(255, 200, 200, 0.5);
      border: 1px solid #d45c5c;
      text-shadow: 0 0 6px #ff4d4d;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #2f0c0c;
      border-radius: 30px;
      padding: 0.3rem 1.2rem 0.3rem 1rem;
      border: 1px solid #b84747;
    }

    .progress-bar-bg {
      width: 110px;
      height: 12px;
      background: #1a0404;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 6px #ff4444;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff2a2a, #ff6b6b, #ff3030);
      border-radius: 20px;
      transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
      box-shadow: 0 0 18px #ff3333, 0 0 8px #ff0000;
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 60%);
      border-radius: 20px;
    }

    .progress-text {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ff7979;
      min-width: 46px;
      text-align: right;
      letter-spacing: 0.3px;
      text-shadow: 0 0 5px #c0392b;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.7rem;
      justify-items: center;
      align-items: center;
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.15s;
    }

    .day-cell:active {
      transform: scale(0.96);
    }

    .day-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #e6b3b3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #2f0d0d;
      padding: 0.2rem 0.5rem;
      border-radius: 14px;
      border: 1px solid #b44848;
      text-shadow: 0 0 4px #a33;
    }

    .habit-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 38px;
      height: 38px;
      background: #1f0505;
      border: 2px solid #d64545;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(200, 20, 20, 0.5);
      position: relative;
      background: radial-gradient(circle at 30% 30%, #3a1010, #140101);
    }

    .habit-checkbox:checked {
      background: #d92020;
      border-color: #ff5e5e;
      box-shadow: 0 0 24px #ff4444, 0 0 12px #ff0000;
      animation: checkPop 0.25s ease-out;
      background: radial-gradient(circle at 30% 30%, #ff4545, #b31212);
    }

    @keyframes checkPop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .habit-checkbox:checked::after {
      content: "✓";
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff0f0;
      display: block;
      line-height: 1;
      text-shadow: 0 0 10px white, 0 0 6px #ffb3b3;
      animation: fadeInTick 0.2s;
    }

    @keyframes fadeInTick {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    .habit-checkbox:hover {
      border-color: #ff7b7b;
      background: #350d0d;
      transform: scale(1.05);
      box-shadow: 0 0 18px #ff4f4f;
    }

    .reset-area {
      display: flex;
      justify-content: center;
      margin-top: 2.4rem;
    }

    .reset-btn {
      background: #330a0a;
      border: 1px solid #e64545;
      color: #ff7a7a;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.8rem 2.4rem;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: 0.25s;
      letter-spacing: 0.8px;
      box-shadow: 0 10px 20px rgba(200, 0, 0, 0.5), 0 0 15px #ff2a2a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: uppercase;
      background: #3d1111;
      border: 1px solid #ff5252;
    }

    .reset-btn:hover {
      background: #b71c1c;
      border-color: #ff8a8a;
      color: #fff0f0;
      box-shadow: 0 14px 26px rgba(255, 30, 30, 0.7), 0 0 28px #ff4444;
      transform: scale(1.02);
    }

    .reset-btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 500px) {
      .tracker-card {
        padding: 1.5rem 1rem;
      }
      .habit-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .progress-wrapper {
        width: 100%;
        justify-content: space-between;
      }
      .habit-checkbox {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="tracker-card">
    <h1>
      🔥 red habits <span>7 days</span>
    </h1>

    <div class="habits-container" id="habitsContainer">
      <!-- dynamically injected -->
    </div>

    <div class="reset-area">
      <button class="reset-btn" id="resetButton">
        <span>⟳</span> reset heat
      </button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- HABITS & DAYS ----------
      const HABIT_NAMES = ["💧 Hydrate", "📚 Read", "🧘 Stretch", "😴 Sleep early"];
      const DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const STORAGE_KEY = "redHotHabitTracker_v2";

      // ---------- STATE ----------
      let habitsData = [];

      // ---------- AUDIO CONTEXT for subtle sound effects ----------
      let audioCtx = null;
      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.log("Web Audio not supported, silent mode.");
        }
      }

      function playCheckSound(checked) {
        if (!audioCtx) return;
        // create short click / spark sound
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        if (checked) {
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        } else {
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.08);
        }
        
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // ---------- LOAD / SAVE ----------
      function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length === HABIT_NAMES.length) {
              const valid = parsed.every(arr => 
                Array.isArray(arr) && arr.length === DAY_LABELS.length &&
                arr.every(v => typeof v === 'boolean')
              );
              if (valid) {
                habitsData = parsed;
                return;
              }
            }
          } catch (e) {}
        }
        // default false
        habitsData = HABIT_NAMES.map(() => DAY_LABELS.map(() => false));
      }

      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(habitsData));
      }

      // ---------- UPDATE PROGRESS UI ----------
      function updateProgress(habitIndex) {
        const row = document.getElementById(`habit-${habitIndex}`);
        if (!row) return;
        const fill = row.querySelector('.progress-fill');
        const text = row.querySelector('.progress-text');
        const completed = habitsData[habitIndex].filter(Boolean).length;
        const total = DAY_LABELS.length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
        if (fill) fill.style.width = `${percent}%`;
        if (text) text.textContent = `${completed}/${total}`;
      }

      function updateAllProgress() {
        for (let i = 0; i < HABIT_NAMES.length; i++) {
          updateProgress(i);
        }
      }

      // ---------- EVENT HANDLER WITH SOUND + ANIMATION TRIGGER ----------
      function handleCheckboxChange(habitIndex, dayIndex) {
        return function(e) {
          const checked = e.target.checked;
          // update state
          habitsData[habitIndex][dayIndex] = checked;
          saveToStorage();
          updateProgress(habitIndex);

          // initialize audio on first user interaction
          initAudio();
          playCheckSound(checked);

          // add a little extra animation to the day cell
          const dayCell = e.target.closest('.day-cell');
          if (dayCell) {
            dayCell.style.transition = '0.1s';
            dayCell.style.transform = 'scale(0.9)';
            setTimeout(() => {
              dayCell.style.transform = '';
            }, 120);
          }
        };
      }

      // ---------- RENDER ALL HABITS ----------
      function renderAllHabits() {
        const container = document.getElementById('habitsContainer');
        if (!container) return;
        container.innerHTML = '';

        habitsData.forEach((daysArr, habitIdx) => {
          const habitName = HABIT_NAMES[habitIdx];
          const row = document.createElement('div');
          row.className = 'habit-row';
          row.id = `habit-${habitIdx}`;

          // header
          const header = document.createElement('div');
          header.className = 'habit-header';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'habit-name';
          nameSpan.textContent = habitName;

          const progWrapper = document.createElement('div');
          progWrapper.className = 'progress-wrapper';

          const progBg = document.createElement('div');
          progBg.className = 'progress-bar-bg';
          const progFill = document.createElement('div');
          progFill.className = 'progress-fill';
          progFill.style.width = '0%';
          progBg.appendChild(progFill);

          const progText = document.createElement('span');
          progText.className = 'progress-text';
          progText.textContent = '0/7';

          progWrapper.appendChild(progBg);
          progWrapper.appendChild(progText);
          header.appendChild(nameSpan);
          header.appendChild(progWrapper);

          // days grid
          const grid = document.createElement('div');
          grid.className = 'days-grid';

          daysArr.forEach((checked, dayIdx) => {
            const cell = document.createElement('div');
            cell.className = 'day-cell';

            const label = document.createElement('span');
            label.className = 'day-label';
            label.textContent = DAY_LABELS[dayIdx];

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'habit-checkbox';
            cb.checked = checked;
            cb.setAttribute('aria-label', `${habitName} ${DAY_LABELS[dayIdx]}`);

            cb.addEventListener('change', handleCheckboxChange(habitIdx, dayIdx));

            cell.appendChild(label);
            cell.appendChild(cb);
            grid.appendChild(cell);
          });

          row.appendChild(header);
          row.appendChild(grid);
          container.appendChild(row);
        });

        updateAllProgress();
      }

      // ---------- RESET ----------
      function resetAllHabits() {
        for (let i = 0; i < habitsData.length; i++) {
          for (let j = 0; j < habitsData[i].length; j++) {
            habitsData[i][j] = false;
          }
        }
        saveToStorage();

        // update UI checkboxes
        const allCheckboxes = document.querySelectorAll('.habit-checkbox');
        allCheckboxes.forEach(cb => { cb.checked = false; });
        updateAllProgress();

        // reset sound effect (quick low tick)
        initAudio();
        if (audioCtx) {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(250, now);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      }

      // ---------- INITIALIZE ----------
      function init() {
        loadFromStorage();
        renderAllHabits();

        const resetBtn = document.getElementById('resetButton');
        if (resetBtn) {
          resetBtn.addEventListener('click', resetAllHabits);
        }

        // activate audio context on first user gesture (click/touch)
        document.body.addEventListener('click', initAudio, { once: true });
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
