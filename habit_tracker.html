<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #FBF7F2;
    --card: #FFFFFF;
    --ink: #4A4458;
    --ink-soft: #9690A3;
    --line: #EFE9F3;

    --habit-1: #E0566F;   /* rose red       */
    --habit-1-soft: #FBE1E5;
    --habit-2: #C9485C;   /* deep rose      */
    --habit-2-soft: #F7DCE0;
    --habit-3: #EF7A8E;   /* rosy pink      */
    --habit-3-soft: #FCE7EB;
    --habit-4: #B23A4E;   /* berry rose     */
    --habit-4-soft: #F4D4D9;
    --habit-5: #F49AA8;   /* soft blush     */
    --habit-5-soft: #FDEDF0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 6px 0 0;
  }

  .habit-card {
    background: var(--card);
    border-radius: 22px;
    padding: 22px 22px 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 20px -10px rgba(74, 68, 88, 0.12);
  }

  .habit-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }

  .habit-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .habit-name {
    font-size: 16.5px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    outline: none;
    font-family: inherit;
    padding: 2px 0;
  }

  .habit-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .progress-track {
    height: 8px;
    border-radius: 8px;
    background: var(--line);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.35s ease;
  }

  .days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .day-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .check {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .check:hover {
    transform: translateY(-1px);
  }

  .check:active {
    transform: scale(0.92);
  }

  .check svg {
    width: 16px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .check.checked svg {
    opacity: 1;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  footer button {
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    padding: 0;
  }

  footer button:hover {
    color: var(--ink);
  }

  @media (max-width: 420px) {
    .day-label { font-size: 9.5px; }
    .habit-name { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">This week</p>
    <h1>Habit Tracker</h1>
    <p class="subtitle">Tap a day to check it off. Your progress saves automatically.</p>
  </header>

  <div id="habitList"></div>

  <footer>
    <button id="resetBtn">Reset this week</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = "habit-tracker-data-v1";
  const DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  const COLORS = [
    { main: "var(--habit-1)", soft: "var(--habit-1-soft)" },
    { main: "var(--habit-2)", soft: "var(--habit-2-soft)" },
    { main: "var(--habit-3)", soft: "var(--habit-3-soft)" },
    { main: "var(--habit-4)", soft: "var(--habit-4-soft)" },
    { main: "var(--habit-5)", soft: "var(--habit-5-soft)" },
  ];

  const DEFAULT_HABITS = [
    { name: "Prayer", days: [false, false, false, false, false, false, false] },
    { name: "Drink water", days: [false, false, false, false, false, false, false] },
    { name: "Move my body", days: [false, false, false, false, false, false, false] },
    { name: "Read 10 minutes", days: [false, false, false, false, false, false, false] },
    { name: "Sleep before midnight", days: [false, false, false, false, false, false, false] },
  ];

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_HABITS);
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return structuredClone(DEFAULT_HABITS);
      return parsed;
    } catch (e) {
      console.error("Could not load saved data, starting fresh.", e);
      return structuredClone(DEFAULT_HABITS);
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    } catch (e) {
      console.error("Could not save data.", e);
    }
  }

  let habits = loadData();

  const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

  function render() {
    const list = document.getElementById("habitList");
    list.innerHTML = "";

    habits.forEach((habit, hIndex) => {
      const color = COLORS[hIndex % COLORS.length];
      const checkedCount = habit.days.filter(Boolean).length;
      const pct = Math.round((checkedCount / 7) * 100);

      const card = document.createElement("div");
      card.className = "habit-card";

      card.innerHTML = `
        <div class="habit-top">
          <div class="habit-name-row">
            <span class="dot" style="background:${color.main}"></span>
            <input class="habit-name" value="${escapeHtml(habit.name)}" data-index="${hIndex}" aria-label="Habit name" />
          </div>
          <span class="habit-count">${checkedCount}/7</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background:${color.main}"></div>
        </div>
        <div class="days-row">
          ${habit.days.map((checked, dIndex) => `
            <div class="day-cell">
              <span class="day-label">${DAY_LABELS[dIndex]}</span>
              <button class="check ${checked ? "checked" : ""}"
                      style="${checked ? `background:${color.soft}; border-color:${color.main}; color:${color.main}` : ""}"
                      data-habit="${hIndex}" data-day="${dIndex}"
                      aria-pressed="${checked}"
                      aria-label="${habit.name}, ${DAY_LABELS[dIndex]}, ${checked ? "completed" : "not completed"}">
                ${checkIcon}
              </button>
            </div>
          `).join("")}
        </div>
      `;

      list.appendChild(card);
    });

    // Wire up checkbox buttons
    document.querySelectorAll(".check").forEach(btn => {
      btn.addEventListener("click", () => {
        const h = parseInt(btn.dataset.habit, 10);
        const d = parseInt(btn.dataset.day, 10);
        habits[h].days[d] = !habits[h].days[d];
        saveData();
        render();
      });
    });

    // Wire up name editing
    document.querySelectorAll(".habit-name").forEach(input => {
      input.addEventListener("change", () => {
        const h = parseInt(input.dataset.index, 10);
        habits[h].name = input.value.trim() || "Untitled habit";
        saveData();
        render();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Reset all checkmarks for this week?")) {
      habits.forEach(h => h.days = h.days.map(() => false));
      saveData();
      render();
    }
  });

  render();
</script>

</body>
</html>
